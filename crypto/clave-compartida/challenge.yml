name: "Clave compartida"
author: "Fac. Informática – Proyecto Escuelas"
category: "Criptografía"

description: |
  <h4 style="margin:0 0 10px 0;text-align:center;">🤝🔑</h4>
  <p>Durante un proyecto de laboratorio, dos compañeros quisieron enviarse mensajes sin que nadie más pudiera leerlos.  
  Eligieron una palabra secreta que ambos conocían — su “clave compartida”.  
  Cada letra del mensaje se desplazaba según la posición de la letra correspondiente en la clave.</p>

  <blockquote style="margin:8px 0;padding:8px;border-left:3px solid #ccc;font-family:monospace;">
  lzaz{izaok_inbio_hnsont}
  </blockquote>

  <p>Ambos recordaban la misma palabra clave,  
  inspirada en el nombre del grupo de trabajo: <strong>GOAT</strong>.</p>

  <p><em>¿Podrás descifrar su mensaje?</em></p>

